name: Deploy to Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: sigma-matchmaker-dev
      FIREBASE_PROJECT_ID: sigma-matchmaker-dev
      GCP_REGION: me-west1
      SERVICE: matchmaker-api
      AR_REPO: matchmaker
      RUNTIME_SA_NAME: matchmaker-runtime
      SECRET_NAME: gemini-api-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate
        env:
          GCP_USER_CREDENTIALS: ${{ secrets.GCP_USER_CREDENTIALS }}
        run: |
          if [ -z "$GCP_USER_CREDENTIALS" ]; then
            echo "Missing GitHub secret GCP_USER_CREDENTIALS"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["GCP_USER_CREDENTIALS"])
          required = ("client_id", "client_secret", "refresh_token", "rapt_token")
          missing = [key for key in required if not data.get(key)]
          if missing:
              print("GCP_USER_CREDENTIALS is missing: " + ", ".join(missing))
              print("Run gcloud auth login mrkcaptcha@merkava.gov.il and update the secret, including rapt_token.")
              sys.exit(1)
          for key in ("client_secret", "refresh_token", "rapt_token"):
              print(f"::add-mask::{data[key]}", flush=True)
          path = os.path.join(os.environ["RUNNER_TEMP"], "gcp-user.json")
          with open(path, "w") as handle:
              json.dump(
                  {
                      "type": "authorized_user",
                      "client_id": data["client_id"],
                      "client_secret": data["client_secret"],
                      "refresh_token": data["refresh_token"],
                      "rapt_token": data["rapt_token"],
                      "quota_project_id": "sigma-matchmaker-dev",
                  },
                  handle,
              )
          os.chmod(path, 0o600)
          with open(os.environ["GITHUB_ENV"], "a") as handle:
              handle.write(f"CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE={path}\n")
          PY
          export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="${RUNNER_TEMP}/gcp-user.json"
          gcloud auth print-access-token --quiet >/dev/null

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push the API image
        id: image
        run: |
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/api:${GITHUB_SHA}"
          docker build --platform linux/amd64 -t "$image" .
          docker push "$image"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Deploy the API to Cloud Run
        run: |
          origins="https://${FIREBASE_PROJECT_ID}.web.app,https://${FIREBASE_PROJECT_ID}.firebaseapp.com"
          gcloud run deploy "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ steps.image.outputs.name }}" \
            --service-account "${RUNTIME_SA_NAME}@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --port 8080 \
            --timeout 300 \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 10 \
            --min-instances 1 \
            --max-instances 3 \
            --allow-unauthenticated \
            --set-secrets "GOOGLE_GENERATIVE_AI_API_KEY=${SECRET_NAME}:latest" \
            --set-env-vars "^|^ALLOWED_ORIGINS=${origins}"

      - name: Read the Cloud Run URL
        id: api
        run: |
          url="$(gcloud run services describe "$SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "API ${url}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Build the website
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}/api
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@sigma/web

      - name: Deploy the website to Firebase Hosting
        env:
          GOOGLE_CLOUD_QUOTA_PROJECT: sigma-matchmaker-dev
          XDG_CONFIG_HOME: ${{ runner.temp }}/firebase-config
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          creds = json.load(open(os.environ["CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE"]))
          access = subprocess.check_output(
              ["gcloud", "auth", "print-access-token", "--quiet"],
              text=True,
          ).strip()
          print(f"::add-mask::{access}", flush=True)
          config_dir = os.path.join(os.environ["XDG_CONFIG_HOME"], "configstore")
          os.makedirs(config_dir, exist_ok=True)
          path = os.path.join(config_dir, "firebase-tools.json")
          with open(path, "w") as handle:
              json.dump(
                  {
                      "user": {"email": "mrkcaptcha@merkava.gov.il"},
                      "tokens": {
                          "access_token": access,
                          "refresh_token": creds["refresh_token"],
                          "expires_at": int(time.time() * 1000) + 45 * 60 * 1000,
                      },
                  },
                  handle,
              )
          os.chmod(path, 0o600)
          PY
          npm install --global firebase-tools@14.27.0
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Write the summary
        run: |
          {
            echo "### Deployment"
            echo "- API: ${{ steps.api.outputs.url }} (Cloud Run, ${GCP_PROJECT_ID})"
            echo "- Site: https://${FIREBASE_PROJECT_ID}.web.app (Firebase Hosting, ${FIREBASE_PROJECT_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
